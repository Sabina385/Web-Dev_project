<header class="header">
  <div class="header-content">
    <div class="logo">
      <i class="play-icon"></i>
      <span>Movie Club</span>
    </div>

    <nav class="nav-menu">
      <a routerLink="/home" routerLinkActive="active" class="nav-link">Home</a>
      <a routerLink="/catalog" routerLinkActive="active" class="nav-link">Catalog</a>
      <a
        routerLink="/profile"
        [queryParams]="{ tab: 'recommendations' }"
        routerLinkActive="active"
        class="nav-link">Recommendations</a>
      <a routerLink="/profile" routerLinkActive="active" class="nav-link">Profile</a>
    </nav>

    <div class="input-logout-btn">
      <button (click)="logout()" class="logout-btn">Log out</button>
    </div>
  </div>
</header>
